# Scaffold: adapt the API command if your Python entry point differs.
# Keep the service names, container ports, runtime .env, and SQLite volume.
services:
  gold-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gold_db
      POSTGRES_USER: gold_admin
      POSTGRES_PASSWORD: gold_admin_dev_password
      TZ: UTC
    volumes:
      - gold-pgdata:/var/lib/postgresql/data
      - ./db/init_gold.sql:/docker-entrypoint-initdb.d/01_init_gold.sql:ro
      - ./data:/seed-data:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold_admin -d gold_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: delivery-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/conversations.sqlite3
    depends_on:
      gold-db:
        condition: service_healthy
    volumes:
      - conversation-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ui:
    image: delivery-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      AGENT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  conversation-data:
  gold-pgdata:
